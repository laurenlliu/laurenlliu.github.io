<script>
  // ---- How to add your own photos ----
  // 1. Put your image files in an "images" folder next to this HTML file
  //    (create the folder if it doesn't exist yet).
  // 2. Add a line below for each photo: { src: "images/yourfile.jpg", caption: "whatever you want" }
  //    caption is optional, leave it out or set it to "" if you don't want one.
  // 3. Keep file sizes reasonable (a few hundred KB each) so the page loads fast.
  //    JPG or WEBP are good choices for photos; PNG is fine for graphics.

  const photos = [
    // { src: "images/graduation.jpg", caption: "UCSC graduation, June 2026" },
    // { src: "images/webgl-demo.jpg", caption: "Demoing the voxel world project" },
  ];

  const grid = document.getElementById("photo-grid");
  const empty = document.getElementById("photo-empty");

  if (photos.length === 0) {
    empty.style.display = "block";
  } else {
    photos.forEach((photo) => {
      const figure = document.createElement("figure");
      figure.className = "photo-card";

      const img = document.createElement("img");
      img.src = photo.src;
      img.alt = photo.caption || "";
      img.loading = "lazy";
      figure.appendChild(img);

      if (photo.caption) {
        const caption = document.createElement("figcaption");
        caption.textContent = photo.caption;
        figure.appendChild(caption);
      }

      grid.appendChild(figure);
    });
  }
</script>
