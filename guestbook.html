<div class="wrap">
  <div class="page-header">

    <h1 class="page-title">Leave a note</h1>
  </div>

  <main id="main-content">
    <div class="guestbook-layout">
      <form class="guestbook-form" id="guestbook-form">
        <input type="text" id="gb-name" placeholder="your name" maxlength="50" required>
        <textarea id="gb-message" placeholder="leave a little note..." maxlength="280" required></textarea>
        <div class="char-count"><span id="gb-count">0</span>/280</div>
        <button type="submit" class="guestbook-submit" id="gb-submit">sign the guestbook</button>
        <div class="guestbook-status" id="gb-status"></div>
      </form>

      <div class="guestbook-grid" id="guestbook-grid">
        <div class="guestbook-empty">loading notes…</div>
      </div>
    </div>
  </main>

<script type="module">
  // ---- Firebase setup ----
  // 1. Go to https://console.firebase.google.com, create a project (free "Spark" plan is enough).
  // 2. In the project, go to Build > Firestore Database > Create database (start in production mode).
  // 3. In Project settings > General, scroll to "Your apps", add a Web app, and copy the config object below.
  // 4. In Firestore > Rules, paste the ruleset from the comment at the bottom of this script and Publish.
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getFirestore, collection, addDoc, query, orderBy, limit,
    onSnapshot, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAqgp0llDm8vCJ3Em7quN8M_yizTbfQmcc",
    authDomain: "lauren-portfolio-9ac16.firebaseapp.com",
    projectId: "lauren-portfolio-9ac16",
    storageBucket: "lauren-portfolio-9ac16.firebasestorage.app",
    messagingSenderId: "182511718410",
    appId: "1:182511718410:web:d6c864e03529cb2630cff3"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const notesRef = collection(db, "guestbook");

  const form = document.getElementById("guestbook-form");
  const nameInput = document.getElementById("gb-name");
  const messageInput = document.getElementById("gb-message");
  const charCount = document.getElementById("gb-count");
  const submitBtn = document.getElementById("gb-submit");
  const status = document.getElementById("gb-status");
  const grid = document.getElementById("guestbook-grid");

  messageInput.addEventListener("input", () => {
    charCount.textContent = messageInput.value.length;
  });

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function timeAgo(date) {
    if (!date) return "just now";
    const seconds = Math.floor((Date.now() - date.getTime()) / 1000);
    if (seconds < 60) return "just now";
    const minutes = Math.floor(seconds / 60);
    if (minutes < 60) return `${minutes}m ago`;
    const hours = Math.floor(minutes / 60);
    if (hours < 24) return `${hours}h ago`;
    const days = Math.floor(hours / 24);
    if (days < 30) return `${days}d ago`;
    return date.toLocaleDateString();
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const name = nameInput.value.trim();
    const message = messageInput.value.trim();
    if (!name || !message) return;

    submitBtn.disabled = true;
    status.textContent = "sending...";

    try {
      await addDoc(notesRef, {
        name: name.slice(0, 50),
        message: message.slice(0, 280),
        createdAt: serverTimestamp()
      });
      form.reset();
      charCount.textContent = "0";
      status.textContent = "thank you! 🐷";
      setTimeout(() => { status.textContent = ""; }, 3000);
    } catch (err) {
      console.error(err);
      status.textContent = "something went wrong, try again";
    } finally {
      submitBtn.disabled = false;
    }
  });

  const notesQuery = query(notesRef, orderBy("createdAt", "desc"), limit(60));
  onSnapshot(notesQuery, (snapshot) => {
    if (snapshot.empty) {
      grid.innerHTML = '<div class="guestbook-empty">no notes yet, be the first to sign!</div>';
      return;
    }
    grid.innerHTML = "";
    snapshot.forEach((doc) => {
      const data = doc.data();
      const date = data.createdAt && data.createdAt.toDate ? data.createdAt.toDate() : null;
      const card = document.createElement("div");
      card.className = "guestbook-card";
      card.innerHTML = `
        <div class="guestbook-note">${escapeHtml(data.message || "")}</div>
        <div class="guestbook-meta">${escapeHtml(data.name || "anonymous")} · ${timeAgo(date)}</div>
      `;
      grid.appendChild(card);
    });
  }, (err) => {
    console.error(err);
    grid.innerHTML = '<div class="guestbook-empty">couldn\'t load notes right now</div>';
  });

  /* ---- Firestore security rules ----
  Paste this into Firestore > Rules and click Publish. It lets anyone read
  and add notes, but caps field sizes and blocks edits/deletes from the client.
  Notes show instantly, there is no approval step.

  rules_version = '2';
  service cloud.firestore {
    match /databases/{database}/documents {
      match /guestbook/{noteId} {
        allow read: if true;
        allow create: if request.resource.data.name is string
          && request.resource.data.name.size() > 0
          && request.resource.data.name.size() <= 50
          && request.resource.data.message is string
          && request.resource.data.message.size() > 0
          && request.resource.data.message.size() <= 280;
        allow update, delete: if false;
      }
    }
  }
  */
</script>

</body>
